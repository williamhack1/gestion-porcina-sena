<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error - Sistema Porcino</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box error-box">

            <h2>⚠️ Error en el sistema</h2>

            <p class="error-message">
                Ha ocurrido un error al procesar la solicitud.  
                Por favor, verifique la información ingresada o intente nuevamente.
            </p>

            <button onclick="window.history.back()">Reintentar</button>

        </div>
    </div>

</body>
</html>
