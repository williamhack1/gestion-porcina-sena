<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sistema Porcino</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">

            <h2>🐖 Sistema de Gestión Porcina</h2>
            <p class="subtitle">Registro de usuario</p>

            <form>

                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" placeholder="Ingrese sus nombres">

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Ingrese sus apellidos">

                <label for="cedula">Cédula</label>
                <input type="number" id="cedula" placeholder="Ingrese su cédula">

                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha">

                <button type="submit">Registrar</button>

                <p class="error">Error en el registro de datos</p>

            </form>

        </div>
    </div>

</body>
</html>
